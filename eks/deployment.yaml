apiVersion: apps/v1
kind: Deployment

metadata:
  name: office-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: office-backend

  template:

    metadata:
      labels:
        app: office-backend

    spec:

      containers:

      - name: office-backend

        image: 379113716280.dkr.ecr.ap-southeast-1.amazonaws.com/office-backend:latest

        ports:
        - containerPort: 5000

        env:

        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: office-config
              key: DB_HOST

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: office-config
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: office-config
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: office-secret
              key: DB_PASSWORD